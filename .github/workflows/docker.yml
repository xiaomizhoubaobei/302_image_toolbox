name: Docker 镜像构建与推送

on:
    push:
        branches:
            - main
        paths:
            - "src/**"
            - "Dockerfile"
    workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: 加固运行器（审计所有出站调用）
              uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
              with:
                  egress-policy: audit

            - name: 检出代码
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: 从 package.json 提取版本号
              id: version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
                  echo "已提取版本: $VERSION"

            - name: 设置 Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            - name: 登录 DockerHub
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: 登录 GitHub 容器注册表
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 登录阿里云容器注册表
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: crpi-wk2d8umombj539de.cn-shanghai.personal.cr.aliyuncs.com
                  username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
                  password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

            - name: 提取依赖版本
              id: deps
              run: |
                  NODE_VERSION=$(node -p "require('./package.json').devDependencies['@types/node'].replace('^', '')")
                  NEXTJS_VERSION=$(node -p "require('./package.json').dependencies.next.replace('^', '')")
                  YARN_VERSION=$(node -p "require('./package.json').packageManager.replace('yarn@', '')")
                  TYPESCRIPT_VERSION=$(node -p "require('./package.json').devDependencies.typescript.replace('^', '')")
                  echo "NODE_VERSION=$NODE_VERSION" >> $GITHUB_OUTPUT
                  echo "NEXTJS_VERSION=$NEXTJS_VERSION" >> $GITHUB_OUTPUT
                  echo "YARN_VERSION=$YARN_VERSION" >> $GITHUB_OUTPUT
                  echo "TYPESCRIPT_VERSION=$TYPESCRIPT_VERSION" >> $GITHUB_OUTPUT
                  echo "Node: $NODE_VERSION, Next.js: $NEXTJS_VERSION, Yarn: $YARN_VERSION, TypeScript: $TYPESCRIPT_VERSION"

            - name: Docker 元数据
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                images: |
                  ${{ secrets.DOCKERHUB_USERNAME }}/302_image_toolbox
                  ghcr.io/${{ github.repository }}
                  crpi-wk2d8umombj539de.cn-shanghai.personal.cr.aliyuncs.com/xmz-1/302_image_toolbox
                # 关闭所有默认生成器
                flavor: |
                  latest=false
                # 只保留版本号标签
                tags: |
                  type=raw,value=${{ steps.version.outputs.VERSION }}

            - name: 构建并推送
              id: build
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                context: .
                platforms: linux/amd64,linux/arm64
                push: true
                tags: ${{ steps.meta.outputs.tags }}
                labels: |
                  org.opencontainers.image.source=https://github.com/xiaomizhoubaobei/302_image_toolbox
                  org.opencontainers.image.description=302 Image Toolbox - 图片工具箱
                  org.opencontainers.image.licenses=AGPL-3.0
                  org.opencontainers.image.title=302 Image Toolbox
                  org.opencontainers.image.maintainer=祁筱欣
                  org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
                  org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
                  org.opencontainers.image.revision=${{ github.sha }}
                  org.opencontainers.image.vendor=xiaomizhoubaobei
                  org.opencontainers.image.authors=qixiaoxin@stu.sqxy.edu.cn
                  build.url=https://github.com/xiaomizhoubaobei/302_image_toolbox/actions/runs/${{ github.run_id }}
                  dependencies.node=${{ steps.deps.outputs.NODE_VERSION }}
                  org.opencontainers.image.nextjs=${{ steps.deps.outputs.NEXTJS_VERSION }}
                  org.opencontainers.image.yarn=${{ steps.deps.outputs.YARN_VERSION }}
                  org.opencontainers.image.typescript=${{ steps.deps.outputs.TYPESCRIPT_VERSION }}
                cache-from: type=gha
                cache-to: type=gha,mode=max
                provenance: true

            - name: 安装 cosign
              uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

            - name: 使用 cosign 签名镜像（无密钥模式）
              env:
                  COSIGN_EXPERIMENTAL: "1"
              run: |
                  echo "使用 cosign 无密钥模式签名镜像..."
                  while IFS= read -r tag; do
                      # 跳过阿里云 ACR 镜像（不支持签名）
                      if [[ "$tag" == *"crpi-"* ]]; then
                          echo "跳过阿里云 ACR 镜像: $tag"
                          continue
                      fi
                      echo "正在签名 $tag"
                      cosign sign --yes "$tag"
                  done <<< "${{ steps.meta.outputs.tags }}"

            - name: 证明 DockerHub 镜像
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                subject-name: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/302_image_toolbox
                subject-digest: ${{ steps.build.outputs.digest }}
                push-to-registry: true

            - name: 证明 GHCR 镜像
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                subject-name: ghcr.io/${{ github.repository_owner }}/302_image_toolbox
                subject-digest: ${{ steps.build.outputs.digest }}
                push-to-registry: true
